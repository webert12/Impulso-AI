
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GrowthPilot</title><link rel="stylesheet" href="/static/app.css"></head>
<body><div class="auth"><a class="back" href="/">← GrowthPilot</a><div class="box"><h1>{{ "Criar conta" if mode=="register" else "Entrar" }}</h1>{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="alert">{{m}}</div>{% endfor %}{% endwith %}<form method="post"><input name="email" type="email" placeholder="Seu e-mail" required><input name="password" type="password" placeholder="Senha (mín. 6 caracteres)" required><button>{{ "Criar conta" if mode=="register" else "Entrar" }}</button></form><p>{% if mode=="register" %}Já possui conta? <a href="/login">Entrar</a>{% else %}Ainda não possui conta? <a href="/register">Criar conta</a>{% endif %}</p></div></div></body></html>
